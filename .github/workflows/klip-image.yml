# Imagem do OpenWA usada pelo Klip em produção (fork com botões nativos).
#
# Publica ghcr.io/<dono>/openwa:<tag> a cada tag `klip-*`. Só linux/amd64:
# é o que o servidor do Klip roda. O pacote precisa ser PÚBLICO (uma vez,
# na UI do GitHub) para o servidor baixar sem login.
name: klip-image

on:
  push:
    tags: ['klip-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome da imagem
        id: ref
        env:
          REPO: ${{ github.repository_owner }}
        run: echo "ref=ghcr.io/${REPO,,}/openwa:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ref.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
